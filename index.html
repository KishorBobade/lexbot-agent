<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>LexBot UI</title>

<style>
body {
    margin: 0;
    font-family: 'Inter', sans-serif;
    background: linear-gradient(135deg, #0f172a, #1e293b);
    color: white;
}

/* Chat container */
.chat-area {
    height: 70vh;
    overflow-y: auto;
    padding: 20px;
}

/* Messages */
.message {
    padding: 14px;
    margin: 12px 0;
    border-radius: 14px;
    max-width: 70%;
    line-height: 1.5;
    animation: fadeIn 0.3s ease-in;
}

/* User */
.user {
    background: linear-gradient(135deg, #3b82f6, #2563eb);
    align-self: flex-end;
}

/* Bot */
.bot {
    background: rgba(255,255,255,0.08);
    backdrop-filter: blur(10px);
}

/* Input box */
.input-box {
    display: flex;
    padding: 15px;
    background: rgba(255,255,255,0.05);
}

input {
    flex: 1;
    padding: 12px;
    border-radius: 12px;
    border: none;
    outline: none;
}

button {
    margin-left: 10px;
    padding: 12px 18px;
    background: #38bdf8;
    border: none;
    border-radius: 12px;
    cursor: pointer;
}

/* Animation */
@keyframes fadeIn {
    from { opacity: 0; transform: translateY(10px); }
    to { opacity: 1; transform: translateY(0); }
}
</style>
</head>

<body>

<div class="container">

    <div class="sidebar">
        <h2>LexBot</h2>
        <p>Legal AI Assistant</p>
    </div>

    <div class="main">

        <div class="header">
            LexBot - Legal Aid Assistant
        </div>

        <div class="chat-area">
            <!--CHAT_AREA-->
        </div>

        <div class="input-box">
            <input id="userInput" placeholder="Ask your legal question...">
            <button onclick="sendMessage()">Send</button>
        </div>

    </div>

</div>
<div id="loader" style="display:none;">🤖 Typing...</div>
<script>
function sendMessage() {
    let input = document.getElementById("userInput");

    if (input.value === "") return;

    // Send value to Streamlit hidden input
    const streamlitInput = window.parent.document.querySelector('input[type="text"]');
    streamlitInput.value = input.value;
    streamlitInput.dispatchEvent(new Event("input", { bubbles: true }));

    input.value = "";
}
function typeText(element, text, speed = 15) {
    let i = 0;
    element.innerHTML = "";

    function typing() {
        if (i < text.length) {
            element.innerHTML += text.charAt(i);
            i++;
            setTimeout(typing, speed);
        }
    }
    typing();
}
function addBotMessage(text) {
    let chat = document.getElementById("chatArea");

    let botMsg = document.createElement("div");
    botMsg.className = "message bot";

    chat.appendChild(botMsg);

    typeText(botMsg, text); // animation here
}
function scrollToBottom() {
    let chat = document.getElementById("chatArea");
    chat.scrollTop = chat.scrollHeight;
}
function showLoader() {
    document.getElementById("loader").style.display = "block";
}

function hideLoader() {
    document.getElementById("loader").style.display = "none";
}
</script>

</body>
</html>
